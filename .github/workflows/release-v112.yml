name: Publish Presentation Remote v1.1.2

# Publish only after the release-preparation PR is merged by the maintainer.
'on':
  push:
    branches:
      - main
    paths:
      - app.config.json
      - .github/workflows/release-v112.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presentation-remote-release-v112
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node for regression tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Check version and avoid duplicate releases
        id: guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string]((Get-Content -Raw -Encoding UTF8 app.config.json | ConvertFrom-Json).version)
          if ($version -ne '1.1.2') { throw "Expected app version 1.1.2, got $version" }
          gh release view v1.1.2 --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release v1.1.2 already exists. Leaving it unchanged.'
            'publish=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v1.1.2" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw 'Tag v1.1.2 exists but the release does not. Inspect it manually to avoid publishing from the wrong commit.'
          }
          'publish=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run source regression tests
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          node scripts/test-all.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source regression tests failed.' }

      - name: Build and verify both standalone HTML variants
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          ./scripts/check-repository.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Standalone verification failed.' }
          $readable = Get-Content -LiteralPath 'dist/index.html' -Raw -Encoding UTF8
          if (-not $readable.Contains('id="versionBadge">v1.1.2</span>')) {
            throw 'The built HTML does not display v1.1.2.'
          }
          foreach ($path in @('dist/index.html', 'dist/index.self-extract.html', 'dist/dependency-manifest.json', 'dist/self-extract-manifest.json')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release input: $path" }
          }

      - name: Package release files and SHA-256 checksums
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'release-out'
          $stage = Join-Path $out 'package'
          New-Item -ItemType Directory -Force -Path $out, $stage, (Join-Path $stage 'assets') | Out-Null

          $readable = Join-Path $out 'htmlapps-presentation-remote-v1.1.2.html'
          $extract = Join-Path $out 'htmlapps-presentation-remote-v1.1.2.self-extract.html'
          $archive = Join-Path $out 'htmlapps-presentation-remote-v1.1.2.zip'
          Copy-Item 'dist/index.html' $readable
          Copy-Item 'dist/index.self-extract.html' $extract

          $packageFiles = @{
            'index.html' = 'dist/index.html'
            'index.self-extract.html' = 'dist/index.self-extract.html'
            'dependency-manifest.json' = 'dist/dependency-manifest.json'
            'self-extract-manifest.json' = 'dist/self-extract-manifest.json'
            'app.config.json' = 'app.config.json'
            'README.md' = 'README.md'
            'README.ja.md' = 'README.ja.md'
            'CHANGELOG.md' = 'CHANGELOG.md'
            'README-FIRST.txt' = 'README-FIRST.txt'
            'LICENSE' = 'LICENSE'
            'THIRD_PARTY_NOTICES.md' = 'THIRD_PARTY_NOTICES.md'
          }
          foreach ($destName in $packageFiles.Keys) {
            Copy-Item -LiteralPath $packageFiles[$destName] -Destination (Join-Path $stage $destName)
          }
          if (Test-Path -LiteralPath 'dist/build-size-report.json') {
            Copy-Item -LiteralPath 'dist/build-size-report.json' -Destination (Join-Path $stage 'build-size-report.json')
          }
          Copy-Item -Path 'assets/screenshot*.png' -Destination (Join-Path $stage 'assets')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal

          $assets = @($readable, $extract, $archive)
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($asset))"
          }
          [System.IO.File]::WriteAllLines((Join-Path $out 'SHA256SUMS.txt'), [string[]]$checksums, (New-Object System.Text.UTF8Encoding($false)))
          foreach ($asset in $assets) {
            $matching = @($checksums | Where-Object { $_ -like "*  $([System.IO.Path]::GetFileName($asset))" })
            if ($matching.Count -ne 1) { throw "Cannot locate checksum: $asset" }
            $expected = ($matching[0] -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Checksum mismatch: $asset" }
          }

      - name: Publish v1.1.2 tag and GitHub Release
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'release-out/htmlapps-presentation-remote-v1.1.2.html',
            'release-out/htmlapps-presentation-remote-v1.1.2.self-extract.html',
            'release-out/htmlapps-presentation-remote-v1.1.2.zip',
            'release-out/SHA256SUMS.txt'
          )
          # gh release create creates the tag on this exact tested commit if absent.
          gh release create v1.1.2 $files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Presentation Remote v1.1.2' --notes-file '.github/releases/v1.1.2.md'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

      - name: Verify published tag target and release assets
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v1.1.2" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the new tag.' }
          if ([string]$tagObject.object.sha -ne [string]$env:GITHUB_SHA) {
            throw 'Published tag does not point at the tested release commit.'
          }
          $published = gh release view v1.1.2 --repo "$env:GITHUB_REPOSITORY" --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the new release.' }
          foreach ($expected in @('htmlapps-presentation-remote-v1.1.2.html', 'htmlapps-presentation-remote-v1.1.2.self-extract.html', 'htmlapps-presentation-remote-v1.1.2.zip', 'SHA256SUMS.txt')) {
            if ($published.assets.name -notcontains $expected) {
              throw "Release asset is missing: $expected"
            }
          }
          Write-Host 'Published v1.1.2 tag and verified all four release assets.'
