# PR source code must never run on the credential-bearing runner.
name: Deploy PR preview
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Validate PowerShell syntax and encoding
      shell: pwsh
      run: |
        if (Test-Path -LiteralPath ".\scripts\check-powershell-syntax.ps1") {
          .\scripts\check-powershell-syntax.ps1
        } else {
          Write-Host "PowerShell syntax preflight is not present in this repository; continuing with the repository check."
        }
    - name: Build and verify standalone HTML
      shell: pwsh
      run: |
        ./scripts/check-repository.ps1
        node --test tests/mobile-footer.test.cjs
        if ($LASTEXITCODE -ne 0) { throw "Footer source regression failed." }
        node scripts/test-webrtc-ice-session-id.mjs
        if ($LASTEXITCODE -ne 0) { throw "WebRTC ICE session tag regression failed." }
        node scripts/test-webrtc-answer-lifecycle.mjs
        if ($LASTEXITCODE -ne 0) { throw "WebRTC Answer lifecycle regression failed." }
    - name: Verify footer and Help in Chromium
      shell: pwsh
      run: |
        $testTools = Join-Path $env:RUNNER_TEMP "mobile-footer-tests"
        npm install --prefix $testTools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
        if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed." }
        $env:NODE_PATH = Join-Path $testTools "node_modules"
        & (Join-Path $testTools "node_modules/.bin/playwright.cmd") install chromium
        if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed." }
        New-Item -ItemType Directory -Force -Path test-results/mobile-footer | Out-Null
        node scripts/mobile-footer.browser.cjs 2>&1 | Tee-Object -FilePath test-results/mobile-footer/results.log
        if ($LASTEXITCODE -ne 0) { throw "Footer browser regression failed." }
    - name: Verify v1.1.0 controls, timer and QR guide in Chromium
      shell: pwsh
      run: |
        $env:NODE_PATH = Join-Path $env:RUNNER_TEMP "mobile-footer-tests/node_modules"
        node scripts/v110.browser.cjs
        if ($LASTEXITCODE -ne 0) { throw "v1.1.0 browser regression failed." }
    - name: Verify preview WebRTC self-test in desktop and mobile Chromium
      shell: pwsh
      run: |
        $env:NODE_PATH = Join-Path $env:RUNNER_TEMP "mobile-footer-tests/node_modules"
        node scripts/webrtc-self-test.browser.cjs
        if ($LASTEXITCODE -ne 0) { throw "Preview WebRTC self-test failed." }
    - name: Upload v1.1.0 browser evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: v110-browser-evidence
        path: test-results/v110/
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload footer browser evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mobile-footer-browser-evidence
        path: test-results/mobile-footer/
        if-no-files-found: ignore
        retention-days: 7
    - name: Check out v1.0.0 reference for manual ICE comparison
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 65e8e58226e7476a07e7d389c9b07252c85869d8
        path: .preview-baseline-v100
        persist-credentials: false
    - name: Stage historical standalone HTML in preview only
      shell: pwsh
      run: |
        $reference = ".preview-baseline-v100/presentation-remote.html"
        if (-not (Test-Path -LiteralPath $reference)) {
          throw "v1.0.0 reference standalone HTML is missing."
        }
        Copy-Item -LiteralPath $reference -Destination "dist/v100.html"
        Write-Host "Historical baseline staged as /v100.html for same-origin A/B testing."
    - name: Stage WebRTC self-test in preview only
      shell: pwsh
      run: |
        Copy-Item -LiteralPath "scripts/webrtc-local-self-test.html" -Destination "dist/webrtc-self-test.html"
        Write-Host "WebRTC self-test staged as /webrtc-self-test.html; not included in standalone release."
    - name: Upload static preview site
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-preview-site
        path: dist/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        include-hidden-files: true
    permissions:
      contents: read
