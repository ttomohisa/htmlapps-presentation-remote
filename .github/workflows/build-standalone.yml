name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "app.config.json"
      - "dependencies.json"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node for behavioral regressions
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Run behavioral regressions
        run: node scripts/test-all.mjs

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Verify v1.1.2 release package in PR CI
        shell: pwsh
        run: |
          ./scripts/package-release-v112.ps1

      - name: Upload release candidate files
        uses: actions/upload-artifact@v7
        with:
          name: v112-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-out/htmlapps-presentation-remote-v1.1.2.html
            release-out/htmlapps-presentation-remote-v1.1.2.self-extract.html
            release-out/htmlapps-presentation-remote-v1.1.2.zip
            release-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14
